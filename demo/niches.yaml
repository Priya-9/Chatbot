      ask_detail: {en: "Which service do you need? (e.g. _AC service_, _deep cleaning 2 BHK_)", hi: "कौन सी सर्विस चाहिए? (जैसे _AC सर्विस_, _2 BHK डीप क्लीनिंग_)"}
