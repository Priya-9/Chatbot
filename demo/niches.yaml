    booking:
      label: {en: Get a trip quote, hi: ट्रिप कोटेशन पाएँ}
      ask_detail: {en: "Where to and how many travellers? (e.g. _Kerala, 2 adults_)", hi: "कहाँ जाना है और कितने लोग? (जैसे _केरल, 2 लोग_)"}
      ask_when: {en: "Travel dates? (approximate is fine)", hi: "यात्रा की तारीख़? (अंदाज़न भी चलेगा)"}
