_meta:
  name: English
  english_name: English

language:
  prompt: "🌐 Please choose your language."
  button: Languages
  set: "Language set to English ✅"

menu:
  welcome: "Hi {name} 👋 Welcome to *{business}*! I'm your virtual assistant, available 24/7."
  prompt: "What can I help you with? You can also just type your question."
  button: Options
  ask_ai: Ask a question
  ask_ai_desc: Instant answers from our AI assistant
  book_demo: Book a demo
  book_demo_desc: Get a personalised walkthrough
  account: My account
  account_desc: Plan and status (verification needed)
  human: Talk to a human
  human_desc: Chat with our support team
  language: Change language
  language_desc: English, Español, हिन्दी, العربية

common:
  invalid_option: "Sorry, I didn't catch that. Please pick one of the options."
  error: "Something went wrong on our side 😕 Please try again in a moment."
  text_only: "I can only read text messages for now. Please type your message."

ai:
  intro: "Ask me anything about *{business}* — pricing, features, policies… Type *menu* anytime to go back."
  refusal: "I'm not able to help with that one. Type *human* to reach our team."
  unavailable: "Our assistant is unavailable right now. Please try again shortly or type *human* to reach our team."

lead:
  ask_name: "Great choice! 🎉 What's your full name?"
  ask_email: "Thanks! What's your work email address?"
  ask_interest: "What would you like to see in the demo? (a line or two is fine)"
  thanks: "You're all set, {lead_name} ✅ Our team will email {email} within one business day to schedule your demo."

validation:
  nonempty: "Please type a reply."
  email: "That doesn't look like a valid email address. Please try again."
  phone: "That doesn't look like a valid phone number. Please try again."
  otp: "Please enter the 6-digit code from your email."

auth:
  ask_email: "🔒 To protect your account, please enter the email address registered with us."
  otp_sent: "We've emailed a 6-digit code to {email_masked}. Please type it here."
  not_found: "We couldn't find an account with that email. Type *human* if you need help."
  invalid_code: "That code is incorrect. Attempts left: {left}. Please try again."
  expired: "That code has expired or is no longer valid. Please start again from the menu."
  too_many: "Too many incorrect attempts. Please start again from the menu."
  success: "Verified ✅"
  logged_out: "You've been signed out."

account:
  summary: "*Your account*\nName: {customer_name}\nEmail: {email}\nPlan: {plan}\nStatus: {status}"

handoff:
  started: "👩‍💼 I've notified our team — a human agent will reply here shortly. Type *bot* to return to the assistant."
  ended: "You're back with the virtual assistant 🤖"

# --- Sales-demo mode (app/journeys/flows/demo.yaml). {business}, {niche_title}, {book_label},
# {examples}... come from demo/niches.yaml; {brand} is BUSINESS_NAME (your freelance brand).
demo:
  niche_prompt: "👋 Hi {name}! I'm an AI WhatsApp assistant built by *{brand}*.\n\nLet's make this demo about *your* business. What kind of business do you run? Pick the closest one 👇"
  niche_button: Business types
  welcome: "Great! For this demo I'm the assistant of *{business}*, a sample {niche_title} business 🎭\n\nTalk to me the way *your customers* would. Try:\n{examples}\n\n_Type *switch* anytime to try another business type._"
  menu_prompt: "*{business}*: how can I help you today? You can also just type your question."
  ask_ai: Ask a question
  ask_ai_desc: Prices, timings, services, answered instantly
  book: "{book_label}"
  book_desc: See a booking land straight in the owner's sheet
  human: Talk to a human
  human_desc: The bot hands the chat over to a real person
  get_bot: Get this bot 🚀
  get_bot_desc: Your own AI assistant, live in a few days
  switch: Try another business
  switch_desc: Pick a different business type
  ai_intro: "Ask me anything a customer of *{business}* would ask, for example:\n{examples}\n\nType *menu* to go back."
  book_ask_name: "Sure! May I have your name, please?"
  book_ask_detail: "{book_ask_detail}"
  book_ask_when: "{book_ask_when}"
  book_thanks: "✅ Thank you {book_name}! Your request is noted:\n*{book_detail}*, {book_when}\n\nThe team will confirm here on WhatsApp shortly."
  book_upsell: "💡 *Behind the scenes:* that request just landed in the owner's Google Sheet / CRM with your name and number, and they were notified, automatically, 24×7.\n\nThat's what *{brand}* builds for businesses like yours. Tap *Get this bot 🚀* in the menu to get one."
  pitch: "🚀 *Want an assistant like this for your business?*\n\n*{brand}* sets it up on your own WhatsApp number:\n• trained on your prices, services and FAQs\n• replies 24×7 in your customers' language\n• bookings and enquiries go to your sheet/CRM\n• hands the chat to you whenever needed\n\nTwo quick questions and we'll get in touch."
  prospect_ask_name: "What's your name?"
  prospect_ask_company: "And your business name and city? (e.g. _Sharma Dental, Pune_)"
  prospect_thanks: "Thank you {prospect_name}! 🙌 We'll WhatsApp you on this number within 24 hours with a free demo customised for *{prospect_company}*.\n\nMeanwhile, keep testing the bot. Type *menu* anytime."
